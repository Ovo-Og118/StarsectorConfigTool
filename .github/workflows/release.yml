name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译
        run: dotnet build StarsectorConfigTool.csproj -c Release --nologo

      - name: 打包
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $bin = 'bin\Release\net48'
          Copy-Item "$bin\StarsectorConfigTool.exe"        $out
          Copy-Item "$bin\StarsectorConfigTool.exe.config" $out
          Copy-Item 'README.md' $out
          Copy-Item 'LICENSE'   $out

          $zip = Join-Path $env:GITHUB_WORKSPACE 'StarsectorConfigTool-win.zip'
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force

          $size = [math]::Round((Get-Item $zip).Length / 1KB, 1)
          Write-Host "打包完成：$zip ($size KB)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StarsectorConfigTool-win
          path: StarsectorConfigTool-win.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StarsectorConfigTool-win.zip
          generate_release_notes: true
